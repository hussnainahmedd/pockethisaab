name: Release (manual, gated)

# Production release pipeline for PocketHisaab.
#
# Safety design (deliberate — do not weaken):
#  - Manual dispatch ONLY. Nothing here can fire from a push, a tag, a
#    schedule, or another workflow, so a release can never happen by
#    accident.
#  - The dispatcher must type PUBLISH and the version must match
#    app.json exactly (version discipline lives in the source, not in
#    the workflow inputs).
#  - A release with the same tag is refused (no duplicates, no
#    overwrites).
#  - Tests, typecheck and Expo config checks run BEFORE the build; any
#    failure aborts the release.
#  - The APK is verified after the build: application ID must be
#    com.hussnain0702.pockethisaab and the signing certificate SHA-256
#    must equal vars.SIGNING_CERT_SHA256 (the certificate that signed
#    v1.1.3 and every earlier release — a different key would make the
#    APK uninstallable as an update and is treated as a hard failure).
#  - version.json (which the in-app update checker reads) is flipped
#    only AFTER the GitHub Release exists, so users are never pointed
#    at a missing download.
#
# Required repository secrets/variables (one-time setup, see
# docs/RELEASE-PIPELINE.md):
#  - secrets.EXPO_TOKEN          Expo access token (EAS Build)
#  - vars.SIGNING_CERT_SHA256    Expected signing cert SHA-256 (colon format)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version — must match app.json (e.g. 2.0.0)"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to confirm an approved production release"
        required: true
        type: string
      notes:
        description: "Release notes in Markdown (optional — changelog is generated when empty)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pockethisaab-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPECTED_CERT_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Gate — confirmation, auth and duplicate checks
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "PUBLISH" ]; then
            echo "::error::Confirmation failed — type PUBLISH to release."
            exit 1
          fi
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Missing secret EXPO_TOKEN. See docs/RELEASE-PIPELINE.md (one-time setup)."
            exit 1
          fi
          if [ -z "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error::Missing variable SIGNING_CERT_SHA256. Signing identity cannot be verified without it — see docs/RELEASE-PIPELINE.md."
            exit 1
          fi
          if gh release view "v${{ inputs.version }}" > /dev/null 2>&1; then
            echo "::error::Release v${{ inputs.version }} already exists — duplicate releases are refused."
            exit 1
          fi
          echo "Pre-checkout gate passed"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate (runs after checkout for git checks)
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "::error::Tag v${VERSION} already exists — duplicate releases are refused."
            exit 1
          fi
          APP_VERSION=$(jq -r .expo.version app.json)
          if [ "${APP_VERSION}" != "${VERSION}" ]; then
            echo "::error::app.json version (${APP_VERSION}) does not match release input (${VERSION})."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(jq -r .expo.android.versionCode app.json)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run finance test suite
        run: npm run test:finance

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo configuration check
        run: npx expo config --type public > /dev/null

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production APK on EAS
        run: |
          set -euo pipefail
          eas build --platform android --profile production-apk --non-interactive --wait
          eas build:list --platform android --status finished --limit 1 --json --non-interactive > build.json
          BUILD_ID=$(jq -r '.[0].id' build.json)
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"
          echo "BUILD_URL=${BUILD_URL}" >> "$GITHUB_ENV"
          echo "EAS build: https://expo.dev/accounts/hussnain0702/projects/pockethisaab/builds/${BUILD_ID}"

      - name: Download APK artifact
        run: |
          set -euo pipefail
          curl -fL "${BUILD_URL}" -o "pockethisaab-v${VERSION}.apk"
          ls -la "pockethisaab-v${VERSION}.apk"

      - name: Verify APK (application ID, size, signing identity)
        run: |
          set -euo pipefail
          APK="pockethisaab-v${VERSION}.apk"
          SIZE=$(stat -c %s "$APK")
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::APK is suspiciously small (${SIZE} bytes)."
            exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          echo "APK package: ${PKG}"
          if [ "${PKG}" != "com.hussnain0702.pockethisaab" ]; then
            echo "::error::Application ID mismatch (${PKG}) — this APK cannot update existing installs."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          CERT=$(grep -i "SHA-256" certs.txt | head -1 | sed 's/.*: //' | tr -d '[:space:]')
          EXPECTED=$(echo "${EXPECTED_CERT_SHA256}" | tr -d ':[:space:]' | tr 'a-f' 'A-F')
          CERT_NORM=$(echo "${CERT}" | tr -d ':' | tr 'a-f' 'A-F')
          echo "Signing cert SHA-256: ${CERT}"
          if [ "${CERT_NORM}" != "${EXPECTED}" ]; then
            echo "::error::Signing certificate mismatch — this APK was NOT signed with the release key and cannot update existing installs. Release aborted."
            exit 1
          fi
          echo "CERT_SHA256=${CERT}" >> "$GITHUB_ENV"

      - name: Checksum
        run: |
          set -euo pipefail
          SHA256=$(sha256sum "pockethisaab-v${VERSION}.apk" | cut -d ' ' -f 1)
          echo "APK_SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "APK SHA-256: ${SHA256}"

      - name: Generate release notes
        run: |
          set -euo pipefail
          {
            echo "## PocketHisaab v${VERSION}"
            echo ""
            if [ -n "${{ inputs.notes }}" ]; then
              echo "${{ inputs.notes }}"
            else
              PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
              echo "### Changes"
              if [ -n "${PREV_TAG}" ]; then
                git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges
              else
                git log --pretty=format:'- %s' --no-merges | head -50
              fi
              echo ""
            fi
            echo ""
            echo "---"
            echo "- **Version:** ${VERSION} (versionCode ${VERSION_CODE})"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo "- **Expo build:** https://expo.dev/accounts/hussnain0702/projects/pockethisaab/builds/${BUILD_ID}"
            echo "- **APK SHA-256:** \`${APK_SHA256}\`"
            echo "- **Signing certificate SHA-256:** \`${CERT_SHA256}\` (same identity as previous releases — installs as an update)"
            echo ""
            echo "**Install:** download \`pockethisaab-v${VERSION}.apk\` below and open it on your Android phone. It installs over your existing PocketHisaab and keeps your data."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" "pockethisaab-v${VERSION}.apk" \
            --title "PocketHisaab v${VERSION}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}"
          echo "RELEASE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_ENV"

      - name: Flip version.json for the in-app update checker
        run: |
          set -euo pipefail
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/pockethisaab-v${VERSION}.apk"
          jq -n --arg url "$APK_URL" --arg v "$VERSION" \
            '{apkUrl: $url, latestVersion: $v, message: "PocketHisaab v" + $v + " is here — see the release notes on GitHub for what is new."}' \
            > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: version.json -> v${VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Release summary
        run: |
          {
            echo "## PocketHisaab v${VERSION} — published"
            echo ""
            echo "- Release: ${RELEASE_URL}"
            echo "- APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/pockethisaab-v${VERSION}.apk"
            echo "- Expo build: https://expo.dev/accounts/hussnain0702/projects/pockethisaab/builds/${BUILD_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- APK SHA-256: ${APK_SHA256}"
            echo "- Signing cert SHA-256: ${CERT_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"
