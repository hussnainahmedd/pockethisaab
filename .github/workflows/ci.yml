name: CI

# Verification only — this workflow never builds APKs and never releases.
# It runs on every push to main and every pull request so the release
# gates in release.yml are never the first time code is checked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run finance test suite
        run: npm run test:finance

      - name: TypeScript check
        run: npm run typecheck

      - name: Expo configuration check
        run: |
          npx expo config --type public > /dev/null
          echo "expo config OK"
